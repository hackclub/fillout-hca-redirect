<div>
  <script>
    const ALPHABET =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const SESSION_TTL = 50 * 60 * 1000;
    let state = Array.from(
      crypto.getRandomValues(new Uint8Array(64)),
      (b) => ALPHABET[b % 62],
    ).join("");

    function initialAuthRedirect() {
      window.top.sessionStorage.setItem("hca_state", state);
      window.top.location.href =
        "https://auth.hackclub.com/oauth/authorize?client_id={CLIENT_ID}&redirect_uri={BASE_URL}/callback&response_type=code&scope=phone+birthdate+address+verification_status+slack_id+basic_info&state=" +
        encodeURIComponent(
          state + "hack_club-redirect_fillout_url" + window.location.href,
        );
    }

    function findInput(name) {
      return [...window.top.document.querySelectorAll("input")].find((i) =>
        [i.name, i.id, i.placeholder, i.getAttribute("aria-label")].some(
          (attr) => attr && attr.toLowerCase() === name,
        ),
      );
    }

    let linked = false;
    let notice = null;
    let submitText = null;
    let appliedControl = null;

    function findSubmitControl() {
      return [
        ...window.top.document.querySelectorAll(".fillout-field-button button"),
      ].find((b) => !b.closest(".fillout-back-button, .fillout-skip-button"));
    }

    function findSubmitLabel(control) {
      return control && control.querySelector("span div div");
    }

    function setButton(paired, text) {
      let btn = document.getElementById("btn");
      btn.classList.remove("btn-paired", "btn-unpaired");
      btn.classList.add(paired ? "btn-paired" : "btn-unpaired");
      btn.innerText = text;
    }

    function notify(text) {
      let label = findSubmitLabel(findSubmitControl());
      if (label) {
        label.innerText = text;
      } else {
        setButton(false, text);
      }
    }

    function applyState() {
      let control = findSubmitControl();
      let label = findSubmitLabel(control);
      if (label && submitText === null) {
        submitText = label.innerText;
      }
      appliedControl = control;
      if (!control) {
        setButton(false, "Continue signing in with Hack Club");
        return;
      }
      control.disabled = !linked;
      control.style.pointerEvents = linked ? "" : "none";
      control.style.opacity = linked ? 1 : 0.5;
      if (label) {
        label.innerText = linked
          ? submitText
          : notice || "Sign in with Hack Club to continue";
      }
      setButton(
        linked,
        linked ? "Logged in with Hack Club" : "Continue with Hack Club",
      );
    }

    function disableButton(message) {
      linked = false;
      notice = message || null;
      applyState();
    }

    function enableButton() {
      linked = true;
      notice = null;
      applyState();
    }

    function populateToken(token) {
      let input = findInput("token");
      if (!input) {
        notify('Missing internal "token" field (contact the YSWS organizer)');
        return false;
      }
      Object.getOwnPropertyDescriptor(
        window.top.HTMLInputElement.prototype,
        "value",
      ).set.call(input, token);
      input.dispatchEvent(new window.top.Event("input", { bubbles: true }));
      return true;
    }

    let sessionDeadline = null;

    function startSession() {
      sessionDeadline = Date.now() + SESSION_TTL;
      setTimeout(checkSession, SESSION_TTL);
      window.top.document.addEventListener("visibilitychange", checkSession);
      window.top.addEventListener("focus", checkSession);
    }

    function checkSession() {
      if (sessionDeadline === null || Date.now() < sessionDeadline) {
        return;
      }
      sessionDeadline = null;
      populateToken("");
      disableButton("Session expired, please relink Hack Club Auth");
    }

    window.top.document.addEventListener(
      "keydown",
      (event) => {
        if (linked || event.key !== "Enter") {
          return;
        }
        let target = event.target;
        if (
          target &&
          (target.tagName === "TEXTAREA" ||
            target.tagName === "SELECT" ||
            target.isContentEditable ||
            (target.closest &&
              target.closest("[role=combobox], [role=listbox], [role=menu]")))
        ) {
          return;
        }
        event.stopPropagation();
      },
      true,
    );

    new window.top.MutationObserver(() => {
      if (findSubmitControl() !== appliedControl) {
        applyState();
      }
    }).observe(window.top.document.body, { childList: true, subtree: true });

    let redeem_id = new URLSearchParams(
      window.top.location.hash.slice(1),
    ).get("hca_redeem");
    let nonce = window.top.sessionStorage.getItem("hca_state");

    if (redeem_id === null || nonce === null) {
      disableButton();
    } else {
      window.top.sessionStorage.removeItem("hca_state");
      window.top.history.replaceState(
        null,
        "",
        window.top.location.pathname + window.top.location.search,
      );
      fetch(
        "{BASE_URL}/redeem?redeem=" +
          encodeURIComponent(redeem_id) +
          "&nonce=" +
          encodeURIComponent(nonce),
        {
          headers: { {NGROK_HEADER} },
        },
      )
        .then((response) => (response.ok ? response.text() : null))
        .then((token) => {
          if (token === null) {
            disableButton();
            return;
          }
          if (populateToken(token)) {
            enableButton();
            startSession();
          }
        });
    }
  </script>
  <p
    id="btn"
    class="btn-unpaired"
    onclick="
      {
        initialAuthRedirect();
      }
    "
  >
    Continue with Hack Club
  </p>
  <style>
    @font-face {
      font-family: "Phantom Sans";
      src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.8/Regular.woff2")
        format("woff2");
      font-display: swap;
    }

    #btn {
      margin: 0;
      user-select: none;
      font-family: "Phantom Sans", sans-serif;
      text-decoration: none;
      height: 44px;
      font-size: 20px;
      font-weight: normal;
      display: inline-flex;
      align-items: center;
      padding-left: 20px;
      padding-right: 20px;
      border-radius: 32px;
    }

    .btn-unpaired {
      background-color: #ec3750;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-unpaired:hover {
      background-color: #fc4760;
    }

    .btn-paired {
      background-color: #49f2a0;
      color: #000;
      cursor: default;
      transition: background-color 0.2s;
    }
  </style>
</div>
