<div>
  <script>
    const ALPHABET =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let state = Array.from(
      crypto.getRandomValues(new Uint8Array(64)),
      (b) => ALPHABET[b % 62],
    ).join("");

    function initialAuthRedirect() {
      window.top.sessionStorage.setItem("hca_state", state);
      window.top.location.href =
        "https://auth.hackclub.com/oauth/authorize?client_id={CLIENT_ID}&redirect_uri={BASE_URL}/callback&response_type=code&scope=phone+birthdate+address+verification_status+slack_id+basic_info&state=" +
        encodeURIComponent(
          state + "hack_club-redirect_fillout_url" + window.location.href,
        );
    }

    function getButton() {
      return [...window.top.document.querySelectorAll("div")].find(
        (d) => !d.children.length && d.textContent.trim() === "Submit",
      );
    }

    function disableButton() {
      let button = getButton();
      button.parentElement.parentElement.parentElement.disabled = true;
      button.parentElement.parentElement.parentElement.style.opacity = 0.5;
      button.innerText = "Sign in with Hack Club to submit";
      document.getElementById("btn").classList.remove("btn-paired");
      document.getElementById("btn").classList.add("btn-unpaired");
      document.getElementById("btn").innerText = "Continue with Hack Club";
    }

    function enableButton() {
      let button = getButton();
      button.parentElement.parentElement.parentElement.disabled = false;
      button.parentElement.parentElement.parentElement.style.opacity = 1;
      button.innerText = "Submit";
      document.getElementById("btn").classList.remove("btn-unpaired");
      document.getElementById("btn").classList.add("btn-paired");
      document.getElementById("btn").innerText = "Logged in with Hack Club";
    }

    function populateToken(token) {
      let input = [...window.top.document.querySelectorAll("input")].find((i) =>
        [i.name, i.id, i.placeholder, i.getAttribute("aria-label")].some(
          (attr) => attr && attr.toLowerCase() === "token",
        ),
      );
      if (!input) {
        getButton().innerText =
          'Missing internal "token" field (contact the YSWS organizer)';
        return false;
      }
      Object.getOwnPropertyDescriptor(
        window.top.HTMLInputElement.prototype,
        "value",
      ).set.call(input, token);
      input.dispatchEvent(new window.top.Event("input", { bubbles: true }));
      return true;
    }

    let redeem_id = new URLSearchParams(
      window.top.location.hash.slice(1),
    ).get("hca_redeem");
    let nonce = window.top.sessionStorage.getItem("hca_state");

    if (redeem_id === null || nonce === null) {
      disableButton();
    } else {
      window.top.sessionStorage.removeItem("hca_state");
      window.top.history.replaceState(
        null,
        "",
        window.top.location.pathname + window.top.location.search,
      );
      fetch(
        "{BASE_URL}/redeem?redeem=" +
          encodeURIComponent(redeem_id) +
          "&nonce=" +
          encodeURIComponent(nonce),
        {
          headers: { {NGROK_HEADER} },
        },
      )
        .then((response) => (response.ok ? response.text() : null))
        .then((token) => {
          if (token === null) {
            disableButton();
            return;
          }
          if (populateToken(token)) {
            enableButton();
          }
        });
    }
  </script>
  <p
    id="btn"
    class="btn-unpaired"
    onclick="
      {
        initialAuthRedirect();
      }
    "
  >
    Continue with Hack Club
  </p>
  <style>
    @font-face {
      font-family: "Phantom Sans";
      src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.8/Regular.woff2")
        format("woff2");
      font-display: swap;
    }

    #btn {
      margin: 0;
      user-select: none;
      font-family: "Phantom Sans", sans-serif;
      text-decoration: none;
      height: 44px;
      font-size: 20px;
      font-weight: normal;
      display: inline-flex;
      align-items: center;
      padding-left: 20px;
      padding-right: 20px;
      border-radius: 32px;
    }

    .btn-unpaired {
      background-color: #ec3750;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-unpaired:hover {
      background-color: #fc4760;
    }

    .btn-paired {
      background-color: #49f2a0;
      color: #000;
      cursor: default;
      transition: background-color 0.2s;
    }
  </style>
</div>
